name: Build

on:
  push:
  workflow_dispatch:

# Builds the add-on with plain javac (no Gradle / Fabric Loom needed).
# Minecraft 26.x is unobfuscated, so compiling straight against Mojang's client jar
# gives exactly the names the game uses at runtime.

env:
  MC_VERSION: '26.3'
  LOADER_VERSION: '0.20.1'
  MOD_VERSION: '1.1.0+mc26.3'
  JAVA_RELEASE: '25'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Finds the project wherever it is in the repo: files at the top level, inside a
      # flashback-skin-timeline folder, or still packed in flashback-skin-timeline.zip.
      - name: Find the project
        run: |
          ZIP=$(find . -maxdepth 3 -iname '*.zip' -not -path './.git/*' | head -n 1)
          if [ -n "$ZIP" ]; then
            echo "Unpacking $ZIP"
            unzip -q -o "$ZIP" -d unpacked
          fi
          SRC=$(find . -type d -path '*/src/main/java' -not -path './.git/*' | awk '{ print length, $0 }' | sort -n | head -n 1 | cut -d' ' -f2-)
          if [ -z "$SRC" ]; then
            echo "::error::Couldn't find the src/main/java folder. Upload the project files (or flashback-skin-timeline.zip) to the repository."
            echo "Files currently in the repository:"
            find . -not -path './.git*' | head -n 100
            exit 1
          fi
          DIR=${SRC%/src/main/java}
          echo "Project found in: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Download Minecraft, Fabric Loader, Mixin and Flashback
        run: |
          set -eo pipefail
          mkdir -p deps/libs
          MANIFEST_URL="https://piston-meta.mojang.com/mc/game/version_manifest_v2.json"
          FABRIC="https://maven.fabricmc.net/net/fabricmc"
          FLASHBACK_URL="https://cdn.modrinth.com/data/4das1Fjq/versions/cV1pa0YV/Flashback-0.43.6-for-MC26.3.jar"
          FLASHBACK_SHA1="4fd7d2d677332f58b00107b27615379eadc6cfcb"

          echo "Minecraft $MC_VERSION: looking up the version"
          curl -fsSL "$MANIFEST_URL" -o deps/manifest.json
          VURL=$(jq -r --arg v "$MC_VERSION" '.versions[] | select(.id == $v) | .url' deps/manifest.json)
          if [ -z "$VURL" ]; then echo "::error::Minecraft $MC_VERSION not found in Mojang's version list"; exit 1; fi
          curl -fsSL "$VURL" -o deps/version.json

          echo "Downloading the Minecraft client"
          CLIENT_URL=$(jq -r '.downloads.client.url' deps/version.json)
          curl -fsSL "$CLIENT_URL" -o deps/minecraft-client.jar

          jq -r '.libraries[].downloads.artifact.url // empty' deps/version.json | sort -u > deps/libraries.txt
          COUNT=$(wc -l < deps/libraries.txt)
          echo "Downloading $COUNT Minecraft libraries"
          if [ "$COUNT" -eq 0 ]; then echo "::error::No libraries listed for Minecraft $MC_VERSION"; exit 1; fi
          i=0
          while read -r url; do
            i=$((i + 1))
            curl -fsSL "$url" -o "deps/libs/$i.jar" || { echo "::error::Couldn't download $url"; exit 1; }
          done < deps/libraries.txt

          echo "Downloading Fabric Loader $LOADER_VERSION"
          curl -fsSL "$FABRIC/fabric-loader/$LOADER_VERSION/fabric-loader-$LOADER_VERSION.jar" -o deps/fabric-loader.jar

          MIXIN=$(curl -fsSL "$FABRIC/sponge-mixin/maven-metadata.xml" | grep -oPm1 '(?<=<release>)[^<]+')
          echo "Downloading Mixin $MIXIN"
          curl -fsSL "$FABRIC/sponge-mixin/$MIXIN/sponge-mixin-$MIXIN.jar" -o deps/sponge-mixin.jar

          # Flashback: only compiled against, never committed or bundled. Checked to be exactly 0.43.6 for MC 26.3.
          echo "Downloading Flashback 0.43.6"
          curl -fsSL "$FLASHBACK_URL" -o deps/Flashback-0.43.6-for-MC26.3.jar
          echo "$FLASHBACK_SHA1  deps/Flashback-0.43.6-for-MC26.3.jar" | sha1sum -c -
          echo "All downloads done"

      - name: Compile and package
        run: |
          set -uo pipefail
          CP=$(find deps -name '*.jar' | tr '\n' ':')
          find "$PROJECT_DIR/src/main/java" -name '*.java' > sources.txt
          echo "Compiling $(wc -l < sources.txt) source files"
          mkdir -p out dist
          if ! javac --release "$JAVA_RELEASE" -proc:none -encoding UTF-8 -nowarn -d out -cp "$CP" @sources.txt > javac.log 2>&1; then
            cat javac.log
            {
              echo '### Compile errors'
              echo '```'
              head -n 80 javac.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Compiling failed. The errors are on the Summary page under 'Compile errors'."
            exit 1
          fi
          cat javac.log

          cp -r "$PROJECT_DIR/src/main/resources/." out/
          sed -i "s/\${version}/$MOD_VERSION/" out/fabric.mod.json
          JAR="dist/flashback-skin-timeline-$MOD_VERSION.jar"
          jar --create --file "$JAR" -C out .
          echo "Built $JAR:"
          jar --list --file "$JAR"
          echo "Built **$(basename "$JAR")**. Download it under Artifacts below." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the add-on jar
        uses: actions/upload-artifact@v4
        with:
          name: flashback-skin-timeline
          path: dist/*.jar
          if-no-files-found: error
